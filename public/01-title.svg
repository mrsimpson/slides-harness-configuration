<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&amp;display=swap');
      text { font-family: 'Fira Code', 'Courier New', monospace; }
    </style>
    <!-- Scanline pattern for CRT effect -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="2" fill="rgba(0,0,0,0.15)"/>
    </pattern>
    <!-- Subtle grid -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,255,160,0.04)" stroke-width="1"/>
    </pattern>
    <!-- Glow filter for text -->
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0d1f0d"/>
      <stop offset="100%" stop-color="#060c0a"/>
    </radialGradient>
    <radialGradient id="leftAgentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,200,100,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,200,100,0)"/>
    </radialGradient>
    <radialGradient id="rightAgentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(60,120,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(60,120,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#scanlines)"/>

  <!-- Ambient glow behind agents -->
  <ellipse cx="480" cy="420" rx="320" ry="260" fill="url(#leftAgentGlow)"/>
  <ellipse cx="1440" cy="420" rx="320" ry="260" fill="url(#rightAgentGlow)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEFT AGENT — "mein Agent"  (green = configured)        -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Agent box border -->
  <text x="200" y="120" fill="#00c864" font-size="18" opacity="0.7" filter="url(#glow-green)">╔══════════════════════════════╗</text>
  <text x="200" y="143" fill="#00c864" font-size="18" opacity="0.7" filter="url(#glow-green)">║  AGENT::alpha  [configured]  ║</text>
  <text x="200" y="166" fill="#00c864" font-size="18" opacity="0.7" filter="url(#glow-green)">╚══════════════════════════════╝</text>

  <!-- ASCII robot face -->
  <text x="275" y="220" fill="#00ff80" font-size="22" filter="url(#glow-green)">  .------.</text>
  <text x="275" y="247" fill="#00ff80" font-size="22" filter="url(#glow-green)"> /  ◉  ◉  \</text>
  <text x="275" y="274" fill="#00ff80" font-size="22" filter="url(#glow-green)">|    ▾▾    |</text>
  <text x="275" y="301" fill="#00ff80" font-size="22" filter="url(#glow-green)"> \  ~~~~  /</text>
  <text x="275" y="328" fill="#00ff80" font-size="22" filter="url(#glow-green)">  '------'</text>

  <!-- Config stack — left agent (green = all configured) -->
  <text x="195" y="390" fill="#00c864" font-size="15" opacity="0.9" filter="url(#glow-green)">┌─────────────────────────────┐</text>
  <text x="195" y="410" fill="#00ff80" font-size="15" filter="url(#glow-green)">│ ▶ PROCESS    ████████████ │</text>
  <text x="195" y="430" fill="#00c864" font-size="15" opacity="0.8" filter="url(#glow-green)">│ ▶ CONVENTIONS  ████████   │</text>
  <text x="195" y="450" fill="#00c864" font-size="15" opacity="0.7" filter="url(#glow-green)">│ ▶ DOCS         ██████     │</text>
  <text x="195" y="470" fill="#00c864" font-size="15" opacity="0.9" filter="url(#glow-green)">└─────────────────────────────┘</text>

  <!-- Left agent status -->
  <text x="195" y="510" fill="#00ff80" font-size="14" opacity="0.6">$ harness status</text>
  <text x="195" y="530" fill="#00c864" font-size="14" filter="url(#glow-green)">✓ shared config loaded</text>
  <text x="195" y="550" fill="#00c864" font-size="14" filter="url(#glow-green)">✓ team conventions active</text>
  <text x="195" y="570" fill="#00c864" font-size="14" filter="url(#glow-green)">✓ process: conventional-commits</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- CENTER — divergence symbol + label                      -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Vertical divider -->
  <line x1="960" y1="80" x2="960" y2="640" stroke="rgba(255,200,50,0.2)" stroke-width="1" stroke-dasharray="8,6"/>

  <!-- Big divergence indicator -->
  <text x="960" y="290" fill="#ffc832" font-size="72" text-anchor="middle" filter="url(#glow-soft)" opacity="0.5">≠</text>

  <!-- Center top label -->
  <text x="960" y="130" fill="#ffc832" font-size="13" text-anchor="middle" opacity="0.5" letter-spacing="4">─ ─ ─  NO SHARED CONTEXT  ─ ─ ─</text>

  <!-- Arrows pointing away from center -->
  <text x="870" y="360" fill="#ffc832" font-size="20" opacity="0.4">◄───</text>
  <text x="1002" y="360" fill="#ffc832" font-size="20" opacity="0.4">───►</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- RIGHT AGENT — "dein Agent"  (blue = differently set)   -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Agent box border -->
  <text x="1230" y="120" fill="#4080ff" font-size="18" opacity="0.7" filter="url(#glow-blue)">╔══════════════════════════════╗</text>
  <text x="1230" y="143" fill="#4080ff" font-size="18" opacity="0.7" filter="url(#glow-blue)">║  AGENT::beta   [diverged]    ║</text>
  <text x="1230" y="166" fill="#4080ff" font-size="18" opacity="0.7" filter="url(#glow-blue)">╚══════════════════════════════╝</text>

  <!-- ASCII robot face — slightly confused -->
  <text x="1305" y="220" fill="#6099ff" font-size="22" filter="url(#glow-blue)">  .------.</text>
  <text x="1305" y="247" fill="#6099ff" font-size="22" filter="url(#glow-blue)"> /  ●  ●  \</text>
  <text x="1305" y="274" fill="#6099ff" font-size="22" filter="url(#glow-blue)">|    ----  |</text>
  <text x="1305" y="301" fill="#6099ff" font-size="22" filter="url(#glow-blue)"> \  ????  /</text>
  <text x="1305" y="328" fill="#6099ff" font-size="22" filter="url(#glow-blue)">  '------'</text>

  <!-- Config stack — right agent (blue = different/missing) -->
  <text x="1225" y="390" fill="#4080ff" font-size="15" opacity="0.9" filter="url(#glow-blue)">┌─────────────────────────────┐</text>
  <text x="1225" y="410" fill="#ff6060" font-size="15">│ ✗ PROCESS    ░░░░░░░░░░░░ │</text>
  <text x="1225" y="430" fill="#6099ff" font-size="15" opacity="0.8" filter="url(#glow-blue)">│ ▶ CONVENTIONS  ████        │</text>
  <text x="1225" y="450" fill="#6099ff" font-size="15" opacity="0.6" filter="url(#glow-blue)">│ ▶ DOCS         ██████████  │</text>
  <text x="1225" y="470" fill="#4080ff" font-size="15" opacity="0.9" filter="url(#glow-blue)">└─────────────────────────────┘</text>

  <!-- Right agent status -->
  <text x="1225" y="510" fill="#6099ff" font-size="14" opacity="0.6">$ harness status</text>
  <text x="1225" y="530" fill="#ff8060" font-size="14">✗ no shared config found</text>
  <text x="1225" y="550" fill="#ffc832" font-size="14" opacity="0.8">⚠ using personal defaults</text>
  <text x="1225" y="570" fill="#ff8060" font-size="14">✗ process: undefined</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BOTTOM CENTER — solution hint                           -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Horizontal rule -->
  <line x1="320" y1="615" x2="1600" y2="615" stroke="rgba(0,200,100,0.15)" stroke-width="1"/>

  <!-- ADE hint bottom center -->
  <text x="960" y="660" fill="#00c864" font-size="16" text-anchor="middle" opacity="0.5" letter-spacing="2">▸  ade setup  →  ade install  →  shared context  ◂</text>

  <!-- Decorative corners -->
  <text x="60"   y="80"  fill="rgba(0,200,100,0.2)" font-size="14">┌─</text>
  <text x="1840" y="80"  fill="rgba(0,200,100,0.2)" font-size="14">─┐</text>
  <text x="60"   y="700" fill="rgba(0,200,100,0.2)" font-size="14">└─</text>
  <text x="1840" y="700" fill="rgba(0,200,100,0.2)" font-size="14">─┘</text>

  <!-- Top decorative line -->
  <text x="960" y="52" fill="rgba(0,200,100,0.25)" font-size="12" text-anchor="middle" letter-spacing="3">· · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · ·</text>
</svg>
