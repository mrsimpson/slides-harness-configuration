<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      text { font-family: 'Fira Code', 'Courier New', monospace; }
    </style>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0e1a12"/>
      <stop offset="100%" stop-color="#070d09"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,220,100,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,220,100,0)"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(80,140,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(80,140,255,0)"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(0,255,120,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <ellipse cx="530" cy="400" rx="400" ry="340" fill="url(#glowLeft)"/>
  <ellipse cx="1390" cy="400" rx="400" ry="340" fill="url(#glowRight)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!--  LEFT AGENT  — green / configured             -->
  <!-- ══════════════════════════════════════════════ -->
  <text x="530" y="160" text-anchor="middle" fill="#00dd70" font-size="52" filter="url(#glow-green)">  .----------.</text>
  <text x="530" y="218" text-anchor="middle" fill="#00dd70" font-size="52" filter="url(#glow-green)"> /            \</text>
  <text x="530" y="276" text-anchor="middle" fill="#00ff88" font-size="52" filter="url(#glow-green)">|  ◉        ◉  |</text>
  <text x="530" y="334" text-anchor="middle" fill="#00dd70" font-size="52" filter="url(#glow-green)">|              |</text>
  <text x="530" y="392" text-anchor="middle" fill="#00ff88" font-size="52" filter="url(#glow-green)">|   \______/   |</text>
  <text x="530" y="450" text-anchor="middle" fill="#00dd70" font-size="52" filter="url(#glow-green)"> \            /</text>
  <text x="530" y="508" text-anchor="middle" fill="#00dd70" font-size="52" filter="url(#glow-green)">  '----------'</text>

  <!-- Neck -->
  <text x="530" y="560" text-anchor="middle" fill="#00dd70" font-size="52" filter="url(#glow-green)">     |    |</text>

  <!-- Label -->
  <text x="530" y="630" text-anchor="middle" fill="#00ff88" font-size="26" filter="url(#glow-green)" letter-spacing="3">AGENT::alpha</text>
  <text x="530" y="668" text-anchor="middle" fill="#00c864" font-size="20" opacity="0.75">✓  shared config loaded</text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  CENTER — divergence                          -->
  <!-- ══════════════════════════════════════════════ -->
  <line x1="960" y1="100" x2="960" y2="700" stroke="rgba(255,200,60,0.18)" stroke-width="2" stroke-dasharray="10,8"/>
  <text x="960" y="410" text-anchor="middle" fill="#ffc832" font-size="110" opacity="0.22">≠</text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  RIGHT AGENT  — blue / unconfigured           -->
  <!-- ══════════════════════════════════════════════ -->
  <text x="1390" y="160" text-anchor="middle" fill="#4d8fff" font-size="52" filter="url(#glow-blue)">  .----------.</text>
  <text x="1390" y="218" text-anchor="middle" fill="#4d8fff" font-size="52" filter="url(#glow-blue)"> /            \</text>
  <text x="1390" y="276" text-anchor="middle" fill="#7ab0ff" font-size="52" filter="url(#glow-blue)">|  ●        ●  |</text>
  <text x="1390" y="334" text-anchor="middle" fill="#4d8fff" font-size="52" filter="url(#glow-blue)">|              |</text>
  <text x="1390" y="392" text-anchor="middle" fill="#7ab0ff" font-size="52" filter="url(#glow-blue)">|   --------   |</text>
  <text x="1390" y="450" text-anchor="middle" fill="#4d8fff" font-size="52" filter="url(#glow-blue)"> \            /</text>
  <text x="1390" y="508" text-anchor="middle" fill="#4d8fff" font-size="52" filter="url(#glow-blue)">  '----------'</text>

  <!-- Neck -->
  <text x="1390" y="560" text-anchor="middle" fill="#4d8fff" font-size="52" filter="url(#glow-blue)">     |    |</text>

  <!-- Label -->
  <text x="1390" y="630" text-anchor="middle" fill="#7ab0ff" font-size="26" filter="url(#glow-blue)" letter-spacing="3">AGENT::beta</text>
  <text x="1390" y="668" text-anchor="middle" fill="#ff7055" font-size="20" opacity="0.85">✗  no shared config found</text>

</svg>
